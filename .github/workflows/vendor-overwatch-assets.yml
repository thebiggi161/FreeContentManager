name: Vendor Overwatch image assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/overwatch/**"

permissions:
  contents: write

concurrency:
  group: vendor-overwatch-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vendor-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and validate Overwatch images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, time, urllib.request, urllib.error
          from pathlib import Path
          from urllib.parse import urlparse

          ROOT = Path("assets/overwatch")
          HERO_DIR = ROOT / "heroes"
          MAP_DIR = ROOT / "maps"
          HERO_DIR.mkdir(parents=True, exist_ok=True)
          MAP_DIR.mkdir(parents=True, exist_ok=True)
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; FreeContentManagerAssetBot/1.0)",
              "Accept": "application/json,image/avif,image/webp,image/png,image/jpeg,*/*",
          }

          def fetch(url, attempts=4):
              last_error = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=45) as response:
                          data = response.read()
                          content_type = response.headers.get("Content-Type", "").split(";")[0].lower()
                      if not data:
                          raise RuntimeError("Empty response")
                      return data, content_type
                  except Exception as exc:
                      last_error = exc
                      if attempt + 1 < attempts:
                          time.sleep(2 ** attempt)
              raise RuntimeError(f"Failed after {attempts} attempts: {url}: {last_error}")

          def fetch_json(url):
              data, content_type = fetch(url)
              try:
                  return json.loads(data.decode("utf-8-sig"))
              except Exception as exc:
                  raise RuntimeError(f"Expected JSON from {url}, got {content_type}: {exc}")

          def slug(value):
              value = str(value or "").lower()
              value = re.sub(r"[^a-z0-9]+", "-", value).strip("-")
              return value or "asset"

          def save_image(url, folder, stem):
              data, content_type = fetch(url)
              signatures = {
                  "image/png": (b"\x89PNG\r\n\x1a\n", ".png"),
                  "image/jpeg": (b"\xff\xd8\xff", ".jpg"),
                  "image/webp": (b"RIFF", ".webp"),
                  "image/gif": (b"GIF8", ".gif"),
                  "image/avif": (None, ".avif"),
              }
              ext = None
              if content_type in signatures:
                  signature, candidate_ext = signatures[content_type]
                  if signature is None or data.startswith(signature):
                      ext = candidate_ext
              if not ext:
                  path_ext = Path(urlparse(url).path).suffix.lower()
                  if path_ext in (".png", ".jpg", ".jpeg", ".webp", ".gif", ".avif"):
                      ext = ".jpg" if path_ext == ".jpeg" else path_ext
                  else:
                      raise RuntimeError(f"URL did not return a recognized image ({content_type}): {url}")
              if len(data) < 100:
                  raise RuntimeError(f"Image response suspiciously small ({len(data)} bytes): {url}")
              path = folder / (stem + ext)
              path.write_bytes(data)
              return "./" + path.as_posix()

          heroes_data = fetch_json("https://overfast-api.tekrop.fr/heroes?locale=en-us")
          if not isinstance(heroes_data, list) or not heroes_data:
              raise RuntimeError("OverFast heroes endpoint returned no list")
          heroes = []
          for item in heroes_data:
              name, image = item.get("name"), item.get("portrait") or item.get("image")
              if not name or not image:
                  continue
              key = item.get("key") or slug(name)
              try:
                  local = save_image(image, HERO_DIR, slug(key))
              except Exception as exc:
                  # Do not silently publish a partial image set: make the run fail visibly.
                  raise RuntimeError(f"Could not download hero portrait for {name}: {exc}") from exc
              heroes.append({"name": name, "key": key, "role": item.get("role", ""), "image": local})
          if not heroes:
              raise RuntimeError("No hero portraits were downloaded")
          (ROOT / "heroes.json").write_text(json.dumps(heroes, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          maps_data = fetch_json("https://overfast-api.tekrop.fr/maps")
          if not isinstance(maps_data, list) or not maps_data:
              raise RuntimeError("OverFast maps endpoint returned no list")
          maps = []
          for item in maps_data:
              name, image = item.get("name"), item.get("screenshot") or item.get("image")
              if not name or not image:
                  continue
              try:
                  local = save_image(image, MAP_DIR, slug(name))
              except Exception as exc:
                  raise RuntimeError(f"Could not download map image for {name}: {exc}") from exc
              maps.append({"name": name, "image": local})
          if not maps:
              raise RuntimeError("No map screenshots were downloaded")
          (ROOT / "maps.json").write_text(json.dumps(maps, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"SUCCESS: downloaded {len(heroes)} hero portraits and {len(maps)} map images.")
          print(f"Hero manifest: {ROOT / 'heroes.json'}")
          print(f"Map manifest: {ROOT / 'maps.json'}")
          PY

      - name: Verify manifests and local image files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("assets/overwatch")
          for manifest in (root / "heroes.json", root / "maps.json"):
              items = json.loads(manifest.read_text(encoding="utf-8"))
              if not items:
                  raise SystemExit(f"Empty manifest: {manifest}")
              for item in items:
                  asset = Path(item["image"].removeprefix("./"))
                  if not asset.is_file() or asset.stat().st_size < 100:
                      raise SystemExit(f"Missing or invalid image: {asset}")
              print(f"Verified {len(items)} entries in {manifest}")
          PY

      - name: Commit downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/overwatch
          if git diff --cached --quiet; then
            echo "Assets are already up to date."
            exit 0
          fi
          git commit -m "Vendor Overwatch hero and map images"
          git push origin "HEAD:${GITHUB_REF_NAME}"
